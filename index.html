<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <meta name="description" content="Ziyanali Saiyed — BCA student and aspiring IT & FinTech professional from Gujarat, India." />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('zs-theme') || 'dark');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

<!-- Header injected by components.js -->
<div id="header-placeholder"></div>

<!-- ── HERO ── -->
<main>
  <section class="hero page" aria-label="Hero">
    <canvas id="particleCanvas" aria-hidden="true"></canvas>
    <div class="hero-inner">
      <!-- Available badge -->
      <div class="hero-badge reveal">
        <span class="pulse-dot"></span>
        <span class="eyebrow" style="margin:0">Available for opportunities</span>
      </div>
      <!-- Name -->
      <p class="hero-greet reveal">Hello, I'm</p>
      <h1 class="hero-name reveal">
        Ziyanali<br>
        <em>Saiyed.</em>
      </h1>
      <!-- Typing -->
      <div class="hero-typing reveal">
        <span style="color:var(--text-muted)">I craft</span>
        <span class="typing-text" id="typingText"></span>
        <span class="typing-cursor" aria-hidden="true">_</span>
      </div>
      <!-- Description -->
      <p class="hero-desc reveal">
        BCA student &amp; aspiring <strong>IT &amp; FinTech professional</strong> from Gujarat, India.
        Building clean, purposeful software that makes a difference.
      </p>
      <!-- CTAs -->
      <div class="hero-actions reveal">
        <a href="/projects/" class="btn btn-primary">View My Work <span class="btn-icon">→</span></a>
        <a href="/contact/"  class="btn btn-ghost">Get in Touch</a>
      </div>
      <!-- Stats -->
      <div class="hero-stats reveal">
        <div class="stat"><strong class="stat-n">2+</strong><span class="stat-l">Projects</span></div>
        <span class="stat-div" aria-hidden="true"></span>
        <div class="stat"><strong class="stat-n">7+</strong><span class="stat-l">Technologies</span></div>
        <span class="stat-div" aria-hidden="true"></span>
        <div class="stat"><strong class="stat-n">BCA</strong><span class="stat-l">Degree</span></div>
      </div>
    </div>
  </section>
</main>

<!-- Footer injected by components.js -->
<div id="footer-placeholder"></div>

<script src="/js/components.js"></script>
<script src="/js/script.js"></script>
</body>
</html>
